<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Interactive JAR Applet Test</title>
</head>
<body>
    <h1>Interactive JAR Applet</h1>
    
    <!-- Code points to the class name; archive points to the packaged JAR file -->
    <applet code="InteractiveApplet.class" archive="InteractiveProgram.jar" width="400" height="150">
        Your environment does not support Java Applets.
    </applet>
</body>
</html>
